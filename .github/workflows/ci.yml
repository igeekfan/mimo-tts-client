name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@11.12.1
      - name: Build real embedded frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags web ./...
      - name: go test
        run: |
          go test ./...
          go test -tags web ./...
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -tags web ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  desktop-build:
    needs: [go, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@11.12.1
      - name: Build real frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build desktop application
        run: wails build -clean
