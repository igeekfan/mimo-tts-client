name: Release Linux App (WebKitGTK 4.1)
run-name: ${{ github.event.release.tag_name || github.event.inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Release Linux App (WebKitGTK 4.1)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform:
          - linux/amd64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo "${{ matrix.platform }}" | sed -e 's#/#_#g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalise version tag
        id: normalise_version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="${{ github.event.inputs.tag }}"
          fi
          version=$(echo "$version" | sed -e 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Ubuntu prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse-dev libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.12.1

      - name: Prepare release build
        shell: bash
        run: |
          jq '.info.productVersion = "${{ steps.normalise_version.outputs.version }}"' wails.json > tmp.json
          mv tmp.json wails.json
          cd frontend
          npm ci

      - name: Build Wails app for Linux
        shell: bash
        run: |
          CGO_ENABLED=1 wails build \
            -platform "${{ matrix.platform }}" \
            -tags webkit2_41 \
            -o mimo-tts-client

      - name: Create Debian package
        shell: bash
        run: |
          APP_NAME="mimo-tts-client"
          build_dir="build/linux/${APP_NAME}_${{ steps.normalise_version.outputs.version }}_amd64"
          mkdir -p "$build_dir/DEBIAN" "$build_dir/usr/local/bin"
          mkdir -p "$build_dir/usr/share/applications"
          mkdir -p "$build_dir/usr/share/icons/hicolor/512x512/apps"

          cat > "$build_dir/DEBIAN/control" << EOF
          Package: ${APP_NAME}
          Version: ${{ steps.normalise_version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ${{ github.repository_owner }} <igeekfan@foxmail.com>
          Depends: libwebkit2gtk-4.1-0
          Description: MiMo TTS Client
           A cross-platform TTS client powered by MiMo-V2.5-TTS.
          EOF

          cp "build/bin/${APP_NAME}" "$build_dir/usr/local/bin/"
          cp build/appicon.png "$build_dir/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"

          cat > "$build_dir/usr/share/applications/${APP_NAME}.desktop" << EOF
          [Desktop Entry]
          Name=MiMo TTS Client
          Comment=TTS Client powered by MiMo-V2.5-TTS
          Exec=/usr/local/bin/${APP_NAME}
          Icon=${APP_NAME}
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          dpkg-deb --build -Zxz "$build_dir"
          mv "${build_dir}.deb" \
            "build/linux/${APP_NAME}_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}_webkit2_41.deb"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalise_version.outputs.version }}
          files: ./build/linux/mimo-tts-client_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}_webkit2_41.deb
          token: ${{ secrets.GITHUB_TOKEN }}
